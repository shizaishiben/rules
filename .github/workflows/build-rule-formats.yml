name: Update and Build Sing-box and Mihomo Rules

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 14 * * *"

permissions:
  contents: write

concurrency:
  group: rule-repository-writer
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pandas requests PyYAML

      - name: Test rule source selection and full rebuild
        run: python -m unittest discover -s tests -v

      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '[.assets[] | select(.name | test("^mihomo-linux-amd64-v.*\\.deb$"))][0].browser_download_url')
          test -n "$url" -a "$url" != "null"
          curl -fL "$url" -o "$RUNNER_TEMP/mihomo.deb"
          mkdir -p "$RUNNER_TEMP/mihomo-package"
          dpkg-deb -x "$RUNNER_TEMP/mihomo.deb" "$RUNNER_TEMP/mihomo-package"
          chmod +x "$RUNNER_TEMP/mihomo-package/usr/bin/mihomo"
          echo "$RUNNER_TEMP/mihomo-package/usr/bin" >> "$GITHUB_PATH"

      - name: Install Sing-box
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases \
            | jq -r '(map(select(.prerelease == true))[0] // map(select(.prerelease == false))[0]).assets[] | select(.name | test("linux.*amd64.*deb")) | .browser_download_url' \
            | head -n 1)
          test -n "$url" -a "$url" != "null"
          curl -fL "$url" -o "$RUNNER_TEMP/sing-box.deb"
          sudo dpkg -i "$RUNNER_TEMP/sing-box.deb"
          sing-box version

      - name: Download AdGuard rule source
        shell: bash
        run: |
          curl --fail --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Adguard.txt" \
            --output adservers.txt
          test -s adservers.txt

      - name: Update linked rule sources
        run: python main.py

      - name: Rebuild all repository rule sets
        run: python scripts/convert_rule_formats.py

      - name: Commit generated rule files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated rule changes"
          else
            git commit -m "Update and build rule sets"
            bash scripts/push-rule-updates.sh
          fi
