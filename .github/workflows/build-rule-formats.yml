name: Build Sing-box and Mihomo Rule Formats

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 14 * * *"
  workflow_run:
    workflows:
      - Update Linked Rule Sources
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: mihomo-rule-build
  cancel-in-progress: false

jobs:
  compile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade PyYAML

      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '[.assets[] | select(.name | test("^mihomo-linux-amd64-v.*\\.deb$"))][0].browser_download_url')
          test -n "$url" -a "$url" != "null"
          curl -fL "$url" -o "$RUNNER_TEMP/mihomo.deb"
          mkdir -p "$RUNNER_TEMP/mihomo-package"
          dpkg-deb -x "$RUNNER_TEMP/mihomo.deb" "$RUNNER_TEMP/mihomo-package"
          chmod +x "$RUNNER_TEMP/mihomo-package/usr/bin/mihomo"
          echo "$RUNNER_TEMP/mihomo-package/usr/bin" >> "$GITHUB_PATH"

      - name: Install Sing-box
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases \
            | jq -r '(map(select(.prerelease == true))[0] // map(select(.prerelease == false))[0]).assets[] | select(.name | test("linux.*amd64.*deb")) | .browser_download_url' \
            | head -n 1)
          test -n "$url" -a "$url" != "null"
          curl -fL "$url" -o "$RUNNER_TEMP/sing-box.deb"
          sudo dpkg -i "$RUNNER_TEMP/sing-box.deb"
          sing-box version

      - name: Convert and compile both rule formats
        run: python scripts/convert_rule_formats.py

      - name: Commit generated rule files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated rule changes"
          else
            git commit -m "Build Mihomo rule sets"
            git push
          fi